name: CI

on:
  push:
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  testsuite:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        dependencies: ['highest']
        include:
          - php-version: '8.2'
            dependencies: 'lowest'
    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: oauth
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: oauth
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: oauth
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      OAUTH_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=oauth
      OAUTH_TEST_MYSQL_USER: root
      OAUTH_TEST_MYSQL_PASSWORD: root
      OAUTH_TEST_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=oauth
      OAUTH_TEST_PGSQL_USER: postgres
      OAUTH_TEST_PGSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: vendor/bin/phpunit
      - name: PDO contract on MariaDB 11.8
        run: vendor/bin/phpunit --filter PdoStorageMysqlTest
        env:
          OAUTH_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3307;dbname=oauth

  coding-standard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
      - run: vendor/bin/phpcs --colors -p

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
      - run: vendor/bin/phpstan analyse --no-progress

  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: curl, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
      - run: tests/Conformance/run.sh
